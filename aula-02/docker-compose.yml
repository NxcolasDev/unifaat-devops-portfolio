version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: technova-api
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=3000
      - DB_HOST=postgres
      - DB_PORT=5433
      - DB_NAME=${POSTGRES_DB:-technova}
      - DB_USER=${POSTGRES_USER:-technova}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-technova_tf_2024}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - technova-network
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: technova-db
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-technova}
      - POSTGRES_USER=${POSTGRES_USER:-technova}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-technova_tf_2024}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-technova} -d ${POSTGRES_DB:-technova}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - technova-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: technova-cache
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - technova-network
    restart: unless-stopped

networks:
  technova-network:
    driver: bridge

volumes:
  pgdata:
    driver: local